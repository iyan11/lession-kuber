apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "deep-reader"
  namespace: "kubelab-deep"
automountServiceAccountToken: false
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "deep-agent-secret"
  namespace: "kubelab-deep"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "reader"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/security/file-reader.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts:
        -
          name: "configuration"
          mountPath: "/config"
          readOnly: true
    -
      name: "agent"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/security/bao.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      args:
        - "agent"
      volumeMounts:
        -
          name: "configuration"
          mountPath: "/config"
          readOnly: false
        -
          name: "identity"
          mountPath: "/identity"
          readOnly: true
  serviceAccountName: "deep-reader"
  volumes:
    -
      name: "configuration"
      emptyDir:
        sizeLimit: "32Mi"
    -
      name: "identity"
      projected:
        sources:
          -
            serviceAccountToken:
              audience: "bao"
              expirationSeconds: 600
              path: "token"
