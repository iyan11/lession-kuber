apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "deep-prometheus"
  namespace: "kubelab-deep"
data:
  prometheus.yaml: "global:\n  scrape_interval: 10s\n  evaluation_interval: 10s\nrule_files:\n  - /etc/learning/rules.yaml\nscrape_configs:\n  - job_name: learning-web\n    static_configs:\n      - targets: ['deep-web:3000']\nalerting:\n  alertmanagers:\n    - static_configs:\n        - targets: ['deep-alertmanager:9093']\n"
  rules.yaml: "groups:\n  - name: learning\n    rules:\n      - alert: LearningErrors\n        expr: increase(kubelab_errors_total[2m]) > 2\n        for: 10s\n        labels:\n          severity: learning\n        annotations:\n          summary: Fictional requests produced errors\n"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "deep-prometheus"
  namespace: "kubelab-deep"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-prometheus"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-prometheus"
  template:
    metadata:
      labels:
        app: "deep-prometheus"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "prometheus"
          image: "prom/prometheus:v3.15.1"
          args:
            - "--config.file=/etc/learning/prometheus.yaml"
            - "--storage.tsdb.path=/data"
            - "--storage.tsdb.retention.time=2h"
            - "--storage.tsdb.retention.size=300MB"
          ports:
            -
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/learning"
              readOnly: true
            -
              name: "data"
              mountPath: "/data"
              readOnly: false
          readinessProbe:
            httpGet:
              path: "/-/ready"
              port: 9090
            periodSeconds: 3
            timeoutSeconds: 2
      volumes:
        -
          name: "config"
          configMap:
            name: "deep-prometheus"
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "deep-prometheus"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "deep-prometheus"
  namespace: "kubelab-deep"
spec:
  selector:
    app: "deep-prometheus"
  ports:
    -
      name: "http"
      port: 9090
      targetPort: 9090
