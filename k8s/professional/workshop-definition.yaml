apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "workshops.learning.kubelab.local"
spec:
  group: "learning.kubelab.local"
  scope: "Namespaced"
  names:
    plural: "workshops"
    singular: "workshop"
    kind: "Workshop"
  versions:
    -
      name: "v1"
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: "object"
          properties:
            apiVersion:
              type: "string"
            kind:
              type: "string"
            metadata:
              type: "object"
            spec:
              type: "object"
              required:
                - "name"
                - "replicas"
              properties:
                name:
                  type: "string"
                  pattern: "^learning-[a-z0-9-]+$"
                  x-kubernetes-validations:
                    -
                      rule: "self == oldSelf"
                      message: "Artifact name is immutable"
                replicas:
                  type: "integer"
                  minimum: 1
                  maximum: 3
            status:
              type: "object"
              properties:
                observedGeneration:
                  type: "integer"
                  format: "int64"
                ready:
                  type: "boolean"
                artifact:
                  type: "string"
      subresources:
        status: {}
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "deep-operator"
  namespace: "kubelab-deep"
automountServiceAccountToken: false
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "deep-operator"
  namespace: "kubelab-deep"
rules:
  -
    apiGroups:
      - "learning.kubelab.local"
    resources:
      - "workshops"
    verbs:
      - "get"
      - "list"
      - "patch"
  -
    apiGroups:
      - "learning.kubelab.local"
    resources:
      - "workshops/status"
    verbs:
      - "get"
      - "patch"
  -
    apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "get"
      - "create"
      - "update"
      - "delete"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "deep-operator"
  namespace: "kubelab-deep"
subjects:
  -
    kind: "ServiceAccount"
    name: "deep-operator"
    namespace: "kubelab-deep"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "deep-operator"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-operator"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-operator"
  template:
    metadata:
      labels:
        app: "deep-operator"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "operator"
          image: "kubelab:deep"
          imagePullPolicy: "Never"
          command:
            - "node"
            - "labs/platform/operator.mjs"
          ports: []
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          args:
            - "run"
      serviceAccountName: "deep-operator"
