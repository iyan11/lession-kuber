apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "etcd-restored"
  namespace: "kubelab-deep"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "512Mi"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "etcd-restored"
  namespace: "kubelab-deep"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "etcd"
      image: "gcr.io/etcd-development/etcd:v3.6.6"
      command:
        - "etcd"
      args:
        - "--name=restored"
        - "--data-dir=/restored/member"
        - "--listen-client-urls=http://0.0.0.0:2379"
        - "--advertise-client-urls=http://localhost:2379"
        - "--initial-cluster=restored=http://localhost:2380"
        - "--initial-advertise-peer-urls=http://localhost:2380"
        - "--listen-peer-urls=http://0.0.0.0:2380"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      volumeMounts:
        -
          name: "restored"
          mountPath: "/restored"
          readOnly: false
      readinessProbe:
        exec:
          command:
            - "etcdctl"
            - "--endpoints=http://127.0.0.1:2379"
            - "--command-timeout=1s"
            - "endpoint"
            - "health"
        periodSeconds: 3
        timeoutSeconds: 2
  initContainers:
    -
      name: "restore"
      image: "gcr.io/etcd-development/etcd:v3.6.6"
      command:
        - "etcdutl"
        - "snapshot"
        - "restore"
        - "/backup/snapshot.db"
        - "--name=restored"
        - "--data-dir=/restored/member"
        - "--initial-cluster=restored=http://localhost:2380"
        - "--initial-advertise-peer-urls=http://localhost:2380"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts:
        -
          name: "backup"
          mountPath: "/backup"
          readOnly: true
        -
          name: "restored"
          mountPath: "/restored"
          readOnly: false
  volumes:
    -
      name: "backup"
      persistentVolumeClaim:
        claimName: "etcd-backup"
    -
      name: "restored"
      persistentVolumeClaim:
        claimName: "etcd-restored"
