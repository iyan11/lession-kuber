apiVersion: "v1"
kind: "Pod"
metadata:
  name: "deep-admitted"
  namespace: "kubelab-deep"
  labels:
    kubelab.local/mutate: "yes"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "client"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/telemetry/idle.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts: []
