apiVersion: "v1"
kind: "Secret"
metadata:
  name: "deep-file"
  namespace: "kubelab-deep"
type: "Opaque"
stringData:
  DEMO_TOKEN: "fictional-generation-one"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-file"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-file"
  template:
    metadata:
      labels:
        app: "deep-file"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "reader"
          image: "kubelab:deep"
          imagePullPolicy: "Never"
          command:
            - "node"
            - "labs/security/file-reader.mjs"
          ports: []
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "config"
              mountPath: "/config"
              readOnly: true
      volumes:
        -
          name: "config"
          secret:
            secretName: "deep-file"
