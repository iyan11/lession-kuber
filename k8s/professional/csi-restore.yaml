apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "deep-restored"
  namespace: "kubelab-deep"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "512Mi"
  storageClassName: "csi-hostpath-sc"
  dataSource:
    name: "deep-snapshot"
    kind: "VolumeSnapshot"
    apiGroup: "snapshot.storage.k8s.io"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "deep-restored"
  namespace: "kubelab-deep"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "reader"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/telemetry/idle.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts:
        -
          name: "data"
          mountPath: "/data"
          readOnly: false
  volumes:
    -
      name: "data"
      persistentVolumeClaim:
        claimName: "deep-restored"
