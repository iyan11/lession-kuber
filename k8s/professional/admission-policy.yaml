apiVersion: "admissionregistration.k8s.io/v1"
kind: "ValidatingAdmissionPolicy"
metadata:
  name: "kubelab-owner"
spec:
  failurePolicy: "Fail"
  matchConstraints:
    resourceRules:
      -
        apiGroups:
          - "apps"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "deployments"
  validations:
    -
      expression: "has(object.metadata.labels) && 'owner' in object.metadata.labels"
      message: "Learning workloads must declare metadata.labels.owner"
---
apiVersion: "admissionregistration.k8s.io/v1"
kind: "ValidatingAdmissionPolicyBinding"
metadata:
  name: "kubelab-owner"
spec:
  policyName: "kubelab-owner"
  validationActions:
    - "Deny"
  matchResources:
    namespaceSelector:
      matchLabels:
        kubelab.local/admission: "enabled"
