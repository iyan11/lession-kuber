apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "learning-reader"
  namespace: "kubelab-deep"
rules:
  -
    apiGroups:
      - ""
    resources:
      - "pods"
      - "services"
      - "events"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "learning-reader"
  namespace: "kubelab-deep"
subjects:
  -
    kind: "User"
    name: "learning:student"
    apiGroup: "rbac.authorization.k8s.io"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "learning-reader"
