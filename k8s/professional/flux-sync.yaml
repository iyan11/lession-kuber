apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "kubelab-gitops"
---
apiVersion: "source.toolkit.fluxcd.io/v1"
kind: "GitRepository"
metadata:
  name: "learning-podinfo"
  namespace: "flux-system"
spec:
  interval: "1m"
  url: "https://github.com/stefanprodan/podinfo"
  ref:
    tag: "6.9.2"
---
apiVersion: "kustomize.toolkit.fluxcd.io/v1"
kind: "Kustomization"
metadata:
  name: "learning-podinfo"
  namespace: "flux-system"
spec:
  interval: "1m"
  retryInterval: "30s"
  timeout: "2m"
  path: "./kustomize"
  prune: true
  targetNamespace: "kubelab-gitops"
  sourceRef:
    kind: "GitRepository"
    name: "learning-podinfo"
  wait: true
