apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "deep-loki"
  namespace: "kubelab-deep"
data:
  loki.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n  path_prefix: /data\n  replication_factor: 1\n  ring:\n    kvstore:\n      store: inmemory\n  storage:\n    filesystem:\n      chunks_directory: /data/chunks\n      rules_directory: /data/rules\nschema_config:\n  configs:\n    - from: 2024-01-01\n      store: tsdb\n      object_store: filesystem\n      schema: v13\n      index:\n        prefix: index_\n        period: 24h\nlimits_config:\n  allow_structured_metadata: true\n  ingestion_rate_mb: 1\n  ingestion_burst_size_mb: 2\ncompactor:\n  working_directory: /data/compactor\n"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "deep-loki"
  namespace: "kubelab-deep"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-loki"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-loki"
  template:
    metadata:
      labels:
        app: "deep-loki"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "loki"
          image: "grafana/loki:3.7.9"
          args:
            - "-config.file=/etc/learning/loki.yaml"
          ports:
            -
              containerPort: 3100
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/learning"
              readOnly: true
            -
              name: "data"
              mountPath: "/data"
              readOnly: false
          readinessProbe:
            httpGet:
              path: "/ready"
              port: 3100
            periodSeconds: 3
            timeoutSeconds: 2
      volumes:
        -
          name: "config"
          configMap:
            name: "deep-loki"
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "deep-loki"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "deep-loki"
  namespace: "kubelab-deep"
spec:
  selector:
    app: "deep-loki"
  ports:
    -
      name: "http"
      port: 3100
      targetPort: 3100
