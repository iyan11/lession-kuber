apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "deep-reviewer"
  namespace: "kubelab-deep"
automountServiceAccountToken: false
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRole"
metadata:
  name: "kubelab-deep-tokenreview"
rules:
  -
    apiGroups:
      - "authentication.k8s.io"
    resources:
      - "tokenreviews"
    verbs:
      - "create"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRoleBinding"
metadata:
  name: "kubelab-deep-tokenreview"
subjects:
  -
    kind: "ServiceAccount"
    name: "deep-reviewer"
    namespace: "kubelab-deep"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "ClusterRole"
  name: "kubelab-deep-tokenreview"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "deep-review"
  namespace: "kubelab-deep"
spec:
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "reviewer"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/telemetry/idle.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts:
        -
          name: "audience"
          mountPath: "/token"
          readOnly: true
  serviceAccountName: "deep-reviewer"
  volumes:
    -
      name: "audience"
      projected:
        sources:
          -
            serviceAccountToken:
              audience: "kubelab-learning-service"
              expirationSeconds: 600
              path: "token"
