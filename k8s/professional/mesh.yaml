apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "kubelab-mesh"
  labels:
    istio-injection: "enabled"
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "allowed"
  namespace: "kubelab-mesh"
automountServiceAccountToken: false
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "denied"
  namespace: "kubelab-mesh"
automountServiceAccountToken: false
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "mesh-server"
  namespace: "kubelab-mesh"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "mesh-server"
  template:
    metadata:
      labels:
        app: "mesh-server"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "web"
          image: "kubelab:deep"
          imagePullPolicy: "Never"
          command:
            - "node"
            - "labs/telemetry/app.mjs"
          ports:
            -
              name: "http"
              containerPort: 3000
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          env:
            -
              name: "LAB_ROLE"
              value: "backend"
      serviceAccountName: "allowed"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "mesh-server"
  namespace: "kubelab-mesh"
spec:
  selector:
    app: "mesh-server"
  ports:
    -
      name: "http"
      port: 3000
      targetPort: 3000
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "mesh-allowed"
  namespace: "kubelab-mesh"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "client"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/telemetry/idle.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts: []
  serviceAccountName: "allowed"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "mesh-denied"
  namespace: "kubelab-mesh"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "client"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/telemetry/idle.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts: []
  serviceAccountName: "denied"
---
apiVersion: "security.istio.io/v1"
kind: "PeerAuthentication"
metadata:
  name: "strict"
  namespace: "kubelab-mesh"
spec:
  mtls:
    mode: "STRICT"
---
apiVersion: "security.istio.io/v1"
kind: "AuthorizationPolicy"
metadata:
  name: "allow-reader"
  namespace: "kubelab-mesh"
spec:
  selector:
    matchLabels:
      app: "mesh-server"
  action: "ALLOW"
  rules:
    -
      from:
        -
          source:
            principals:
              - "cluster.local/ns/kubelab-mesh/sa/allowed"
