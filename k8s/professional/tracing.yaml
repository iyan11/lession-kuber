apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "deep-collector"
  namespace: "kubelab-deep"
data:
  collector.yaml: "receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_mib: 128\n  batch:\n    timeout: 1s\nexporters:\n  otlphttp:\n    endpoint: http://deep-tempo:4318\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, batch]\n      exporters: [otlphttp]\n"
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "deep-tempo"
  namespace: "kubelab-deep"
data:
  tempo.yaml: "server:\n  http_listen_port: 3200\ndistributor:\n  receivers:\n    otlp:\n      protocols:\n        http:\n          endpoint: 0.0.0.0:4318\nstorage:\n  trace:\n    backend: local\n    wal:\n      path: /data/wal\n    local:\n      path: /data/traces\ncompactor:\n  compaction:\n    block_retention: 1h\n"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "deep-tempo"
  namespace: "kubelab-deep"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-tempo"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-tempo"
  template:
    metadata:
      labels:
        app: "deep-tempo"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "tempo"
          image: "grafana/tempo:2.9.0"
          args:
            - "-config.file=/etc/learning/tempo.yaml"
          ports:
            -
              containerPort: 3200
            -
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/learning"
              readOnly: true
            -
              name: "data"
              mountPath: "/data"
              readOnly: false
          readinessProbe:
            httpGet:
              path: "/ready"
              port: 3200
            periodSeconds: 3
            timeoutSeconds: 2
      volumes:
        -
          name: "config"
          configMap:
            name: "deep-tempo"
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "deep-tempo"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "deep-tempo"
  namespace: "kubelab-deep"
spec:
  selector:
    app: "deep-tempo"
  ports:
    -
      name: "query"
      port: 3200
    -
      name: "otlp"
      port: 4318
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-collector"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-collector"
  template:
    metadata:
      labels:
        app: "deep-collector"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "collector"
          image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.164.0"
          args:
            - "--config=/etc/learning/collector.yaml"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            -
              containerPort: 4318
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/learning"
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 4318
            periodSeconds: 2
      volumes:
        -
          name: "config"
          configMap:
            name: "deep-collector"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "deep-collector"
  namespace: "kubelab-deep"
spec:
  selector:
    app: "deep-collector"
  ports:
    -
      name: "http"
      port: 4318
      targetPort: 4318
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-backend"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-backend"
  template:
    metadata:
      labels:
        app: "deep-backend"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "web"
          image: "kubelab:deep"
          imagePullPolicy: "Never"
          command:
            - "node"
            - "labs/telemetry/app.mjs"
          ports:
            -
              name: "http"
              containerPort: 3000
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          env:
            -
              name: "LAB_ROLE"
              value: "backend"
            -
              name: "OTLP_ENDPOINT"
              value: "http://deep-collector:4318/v1/traces"
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 3000
            periodSeconds: 2
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "deep-backend"
  namespace: "kubelab-deep"
spec:
  selector:
    app: "deep-backend"
  ports:
    -
      name: "http"
      port: 3000
      targetPort: 3000
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "deep-frontend"
  namespace: "kubelab-deep"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "deep-frontend"
  template:
    metadata:
      labels:
        app: "deep-frontend"
        kubelab.local/monitor: "yes"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "web"
          image: "kubelab:deep"
          imagePullPolicy: "Never"
          command:
            - "node"
            - "labs/telemetry/app.mjs"
          ports:
            -
              name: "http"
              containerPort: 3000
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          env:
            -
              name: "LAB_ROLE"
              value: "frontend"
            -
              name: "OTLP_ENDPOINT"
              value: "http://deep-collector:4318/v1/traces"
            -
              name: "BACKEND_URL"
              value: "http://deep-backend:3000"
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 3000
            periodSeconds: 2
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "deep-frontend"
  namespace: "kubelab-deep"
spec:
  selector:
    app: "deep-frontend"
  ports:
    -
      name: "http"
      port: 3000
      targetPort: 3000
