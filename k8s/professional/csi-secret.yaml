apiVersion: "secrets-store.csi.x-k8s.io/v1"
kind: "SecretProviderClass"
metadata:
  name: "deep-bao"
  namespace: "kubelab-deep"
spec:
  provider: "openbao"
  parameters:
    baoAddress: "http://deep-bao.kubelab-deep.svc:8200"
    roleName: "application"
    audience: "bao"
    objects: "- objectName: DEMO_TOKEN\n  secretPath: secret/data/application\n  secretKey: DEMO_TOKEN\n"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "deep-csi-secret"
  namespace: "kubelab-deep"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "reader"
      image: "kubelab:deep"
      imagePullPolicy: "Never"
      command:
        - "node"
        - "labs/security/file-reader.mjs"
      ports: []
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      volumeMounts:
        -
          name: "configuration"
          mountPath: "/config"
          readOnly: true
  serviceAccountName: "deep-reader"
  volumes:
    -
      name: "configuration"
      csi:
        driver: "secrets-store.csi.k8s.io"
        readOnly: true
        volumeAttributes:
          secretProviderClass: "deep-bao"
