apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubelab-notes
  namespace: kubelab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab-storage
  namespace: kubelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubelab-storage
  template:
    metadata:
      labels:
        app: kubelab-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: notes
          image: kubelab:1.0
          imagePullPolicy: Never
          command: ["node", "-e"]
          args: ["setInterval(() => {}, 1000)"]
          volumeMounts:
            - name: notes
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: notes
          persistentVolumeClaim:
            claimName: kubelab-notes
