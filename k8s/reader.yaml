apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelab-reader
  namespace: kubelab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubelab-pod-reader
  namespace: kubelab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubelab-pod-reader
  namespace: kubelab
subjects:
  - kind: ServiceAccount
    name: kubelab-reader
    namespace: kubelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubelab-pod-reader
