apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "kubelab-route"
  namespace: "kubelab"
spec:
  ingressClassName: "nginx"
  rules:
    -
      host: "kubelab.test"
      http:
        paths:
          -
            path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "kubelab"
                port:
                  number: 80
