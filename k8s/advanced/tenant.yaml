apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "kubelab-team"
---
apiVersion: "v1"
kind: "ResourceQuota"
metadata:
  name: "team-budget"
  namespace: "kubelab-team"
spec:
  hard:
    pods: "5"
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
---
apiVersion: "v1"
kind: "LimitRange"
metadata:
  name: "container-defaults"
  namespace: "kubelab-team"
spec:
  limits:
    -
      type: "Container"
      defaultRequest:
        cpu: "25m"
        memory: "32Mi"
      default:
        cpu: "200m"
        memory: "128Mi"
