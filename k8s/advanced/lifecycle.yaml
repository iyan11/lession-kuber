apiVersion: "v1"
kind: "Pod"
metadata:
  name: "kubelab-lifecycle"
  namespace: "kubelab"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "worker"
      image: "kubelab:1.0"
      imagePullPolicy: "Never"
      ports:
        -
          name: "http"
          containerPort: 3000
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
      command:
        - "node"
        - "-e"
      args:
        - "console.log('started'); process.on('SIGTERM', () => { console.log('finishing'); setTimeout(() => process.exit(0), 1000) }); setInterval(() => {}, 1000)"
  terminationGracePeriodSeconds: 10
