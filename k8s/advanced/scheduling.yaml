apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "kubelab-placement"
  namespace: "kubelab"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "kubelab-placement"
  template:
    metadata:
      labels:
        app: "kubelab-placement"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "web"
          image: "kubelab:1.0"
          imagePullPolicy: "Never"
          ports:
            -
              name: "http"
              containerPort: 3000
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      nodeSelector:
        kubernetes.io/os: "linux"
