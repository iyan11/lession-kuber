apiVersion: v1
kind: Secret
metadata:
  name: kubelab-demo
  namespace: kubelab
type: Opaque
stringData:
  DEMO_TOKEN: only-a-learning-example
---
apiVersion: v1
kind: Pod
metadata:
  name: kubelab-secret-check
  namespace: kubelab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: check
      image: kubelab:1.0
      imagePullPolicy: Never
      command: ["node", "-e"]
      args:
        - "console.log(process.env.DEMO_TOKEN ? 'DEMO_TOKEN is set' : 'DEMO_TOKEN is missing')"
      env:
        - name: DEMO_TOKEN
          valueFrom:
            secretKeyRef:
              name: kubelab-demo
              key: DEMO_TOKEN
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
